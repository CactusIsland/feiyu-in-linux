<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>大肥鱼 · 记忆图谱</title>
<style>
  :root {
    --bg: #f3f6fb;
    --card: #ffffff;
    --ink: #1d2a3a;
    --muted: #7b879a;
    --line: #e5ebf3;
    --blue: #4a90e2;
    --gold: #b8860b;
    --green: #5aa469;
    --red: #c4556b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: linear-gradient(180deg, #eef5ff 0%, var(--bg) 240px);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 26px 20px 60px; }
  header { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
  h1 { font-size: 24px; margin: 0; letter-spacing: .5px; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .spacer { flex: 1; }
  button {
    border: 1px solid var(--line); background: #fff; color: var(--ink);
    border-radius: 10px; padding: 8px 14px; font-size: 13px; cursor: pointer;
    transition: .15s ease;
  }
  button:hover { border-color: var(--blue); color: var(--blue); transform: translateY(-1px); }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; margin: 20px 0; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; box-shadow: 0 4px 14px rgba(33, 66, 110, .04); }
  .stat b { display: block; font-size: 22px; line-height: 1.2; }
  .stat span { color: var(--muted); font-size: 12px; }
  .grid { display: grid; grid-template-columns: 1.05fr 1fr; gap: 16px; }
  @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; margin-bottom: 16px; box-shadow: 0 4px 14px rgba(33, 66, 110, .04); }
  .card h2 { font-size: 15px; margin: 0 0 12px; font-weight: 600; }
  .muted { color: var(--muted); font-size: 12px; }
  .row { display: flex; gap: 10px; align-items: flex-start; padding: 9px 0; border-bottom: 1px dashed var(--line); }
  .row:last-child { border-bottom: 0; }
  .row .body { flex: 1; min-width: 0; }
  .row .text { font-size: 13px; line-height: 1.5; word-break: break-word; }
  .row .meta { color: var(--muted); font-size: 11px; margin-top: 3px; }
  .badge { display: inline-block; font-size: 10px; color: #fff; border-radius: 999px; padding: 2px 7px; margin-left: 6px; vertical-align: 1px; white-space: nowrap; }
  .people .row { align-items: center; }
  .avatar { width: 34px; height: 34px; border-radius: 50%; background: #e8f3ff; border: 1px solid #cfe3fb; display: flex; align-items: center; justify-content: center; font-size: 14px; flex: 0 0 auto; }
  .small-btn { font-size: 11px; padding: 4px 9px; border-radius: 8px; }
  #graph svg { width: 100%; height: auto; display: block; }
  .empty { color: var(--muted); font-size: 13px; padding: 14px 0; }
  .err { color: var(--red); font-size: 13px; padding: 12px; }
  footer { color: var(--muted); font-size: 11px; text-align: center; margin-top: 24px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>大肥鱼 · 记忆图谱</h1>
      <div class="sub" id="sub">正在加载…</div>
    </div>
    <div class="spacer"></div>
    <button id="refresh">刷新</button>
  </header>

  <section class="stats" id="stats"></section>

  <div class="grid">
    <section class="card">
      <h2>关系图</h2>
      <div id="graph"><div class="muted">正在加载…</div></div>
    </section>
    <section class="card">
      <h2>人物</h2>
      <div id="people" class="people"></div>
    </section>
  </div>

  <section class="card"><h2>约定 / 第一次</h2><div id="promises"></div></section>
  <section class="card"><h2>偏好</h2><div id="preferences"></div></section>
  <section class="card"><h2>最近的事</h2><div id="events"></div></section>
  <section class="card"><h2>快忘记</h2><div id="fading"></div></section>

  <footer>数据只来自这台机器上的 Aurabot；每 30 秒自动刷新。</footer>
</div>

<script>
(() => {
  const WEIGHT = {
    never: { label: '永不遗忘', color: '#b8860b' },
    slow: { label: '慢慢淡', color: '#4a90e2' },
    normal: { label: '正常', color: '#8a94a6' },
    fast: { label: '可忘', color: '#c4556b' },
  };
  const KINDS = ['熟人', '群友', '陌生人', '主人'];
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const clip = (s, n) => {
    const t = String(s || '').replace(/\s+/g, ' ').trim();
    return t.length > n ? t.slice(0, n) + '…' : t;
  };
  const fmtTime = (at) => {
    if (!at) return '';
    const d = new Date(Number(at));
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  };

  let map = null;
  let loading = false;

  function badge(weight) {
    const w = WEIGHT[weight] || WEIGHT.normal;
    return '<span class="badge" style="background:' + w.color + '">' + esc(w.label) + '</span>';
  }

  function stat(label, value) {
    return '<div class="stat"><b>' + esc(value == null ? 0 : value) + '</b><span>' + esc(label) + '</span></div>';
  }

  function itemRow(item, key) {
    const pinned = Boolean(map && (map.pinnedIds || []).includes(item.id));
    const weight = item.weight || 'normal';
    return '<div class="row">'
      + '<div class="body">'
      + '<div class="text">' + esc(clip(item.text, 110)) + badge(weight) + '</div>'
      + '<div class="meta">' + esc([item.when, item.about, item.retention != null ? ('清晰度 ' + item.retention) : ''].filter(Boolean).join(' · ')) + '</div>'
      + (item.id ? '<div style="margin-top:6px"><button class="small-btn" data-pin="' + esc(item.id) + '" data-pinned="' + (pinned ? '1' : '0') + '">' + (pinned ? '取消保护' : (weight === 'never' ? '已保护' : '设为永不遗忘')) + '</button></div>' : '')
      + '</div></div>';
  }

  function section(id, items, emptyText) {
    const el = $(id);
    if (!items || !items.length) {
      el.innerHTML = '<div class="empty">' + esc(emptyText || '还没有') + '</div>';
      return;
    }
    el.innerHTML = items.map((it) => itemRow(it, id)).join('');
  }

  function people() {
    const el = $('people');
    const list = (map.people || []);
    if (!list.length) {
      el.innerHTML = '<div class="empty">还没有关于别人的记忆</div>';
      return;
    }
    el.innerHTML = list.map((p) => {
      const owner = String(p.key || '').indexOf('owner:') === 0;
      const next = KINDS[(KINDS.indexOf(p.kind) + 1) % KINDS.length];
      return '<div class="row">'
        + '<div class="avatar">' + esc(String(p.name || '?').slice(0, 1)) + '</div>'
        + '<div class="body">'
        + '<div class="text"><b>' + esc(p.name) + '</b>（' + esc(p.kind) + '）' + esc(p.count) + ' 条' + badge(p.weight) + '</div>'
        + '<div class="meta">' + esc(clip(p.lastText || '', 60)) + '</div>'
        + (owner ? '' : '<div style="margin-top:6px"><button class="small-btn" data-kind="' + esc(p.key) + '" data-next="' + esc(next) + '">改关系：' + esc(next) + '</button></div>')
        + '</div></div>';
    }).join('');
  }

  function graph() {
    const el = $('graph');
    const people = (map.people || []).slice(0, 12);
    if (!people.length) {
      el.innerHTML = '<div class="empty">还没有人物节点</div>';
      return;
    }
    const W = 460, H = 320, cx = 230, cy = 160, r = 112;
    const nodes = people.map((p, i) => {
      const a = -Math.PI / 2 + i * 2 * Math.PI / people.length;
      return { p, x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) };
    });
    const colorOf = (kind) => kind === '主人' ? '#b8860b' : kind === '群友' ? '#4a90e2' : kind === '陌生人' ? '#8a94a6' : '#5aa469';
    const parts = [];
    parts.push('<svg viewBox="0 0 460 320" role="img" aria-label="人物关系图">');
    for (const n of nodes) {
      parts.push('<line x1="' + cx + '" y1="' + cy + '" x2="' + n.x.toFixed(1) + '" y2="' + n.y.toFixed(1) + '" stroke="#d7e1ee" stroke-width="1.5"/>');
    }
    for (const n of nodes) {
      parts.push('<circle cx="' + n.x.toFixed(1) + '" cy="' + n.y.toFixed(1) + '" r="18" fill="#fff" stroke="' + colorOf(n.p.kind) + '" stroke-width="2"/>');
      parts.push('<text x="' + n.x.toFixed(1) + '" y="' + (n.y + 4).toFixed(1) + '" text-anchor="middle" font-size="10" fill="#334">' + esc(String(n.p.name || '?').slice(0, 5)) + '</text>');
      parts.push('<text x="' + n.x.toFixed(1) + '" y="' + (n.y + 31).toFixed(1) + '" text-anchor="middle" font-size="9" fill="#8a94a6">' + esc(n.p.kind) + ' · ' + esc(n.p.count) + '</text>');
    }
    parts.push('<circle cx="' + cx + '" cy="' + cy + '" r="30" fill="#e8f3ff" stroke="#4a90e2" stroke-width="2"/>');
    parts.push('<text x="' + cx + '" y="' + (cy + 4) + '" text-anchor="middle" font-size="12" fill="#235">大肥鱼</text>');
    parts.push('</svg>');
    el.innerHTML = parts.join('');
  }

  function render() {
    const s = map.stats || {};
    $('sub').textContent = '生成于 ' + (map.generatedAt ? new Date(map.generatedAt).toLocaleString('zh-CN') : '未知') + ' · 只读视图，可在这里改保护/关系';
    $('stats').innerHTML = [
      stat('有效记忆', s.live), stat('人物', s.people), stat('永不遗忘', s.never), stat('快忘记', s.fading), stat('过时', s.outdated)
    ].join('');
    graph();
    people();
    section('promises', map.promises || [], '还没有约定或第一次');
    section('preferences', map.preferences || [], '还没有明确的喜好');
    section('events', map.events || [], '还没有经历或日记');
    section('fading', map.fading || [], '没有快忘记的记忆');
  }

  async function load() {
    if (loading) return;
    loading = true;
    try {
      const r = await fetch('map', { cache: 'no-store' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      map = await r.json();
      render();
    } catch (e) {
      $('sub').innerHTML = '<span class="err">加载失败：' + esc(e.message || e) + '</span>';
    } finally {
      loading = false;
    }
  }

  async function post(path, body) {
    const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }

  document.addEventListener('click', async (e) => {
    const pin = e.target.closest('[data-pin]');
    if (pin) {
      const id = pin.getAttribute('data-pin');
      const pinned = pin.getAttribute('data-pinned') === '1';
      try { await post('pin', { id, pinned: !pinned }); await load(); } catch (err) { alert('操作失败：' + err.message); }
      return;
    }
    const kind = e.target.closest('[data-kind]');
    if (kind) {
      const key = kind.getAttribute('data-kind');
      const next = kind.getAttribute('data-next');
      try { await post('person', { key, kind: next }); await load(); } catch (err) { alert('改关系失败：' + err.message); }
    }
  });

  $('refresh').addEventListener('click', load);
  setInterval(load, 30_000);
  load();
})();
</script>
</body>
</html>
