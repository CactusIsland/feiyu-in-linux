<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>大肥鱼 · 面板</title>
<style>
  :root {
    --bg: #0f1115; --card: #171a21; --card2: #1e222b; --line: #262b36;
    --text: #e8ecf3; --dim: #8b93a7; --accent: #4ea1ff; --ok: #45d483;
    --warn: #ffb74d; --bad: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.6 "Microsoft YaHei", system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 14px; padding: 14px 20px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: rgba(15,17,21,.92); backdrop-filter: blur(8px); z-index: 9; }
  header h1 { font-size: 17px; margin: 0; letter-spacing: 1px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; }
  .chip { padding: 3px 10px; border-radius: 999px; background: var(--card2); color: var(--dim); font-size: 12px; border: 1px solid var(--line); }
  .chip b { color: var(--text); font-weight: 600; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: var(--bad); }
  .dot.on { background: var(--ok); }
  nav { display: flex; gap: 4px; padding: 10px 20px 0; flex-wrap: wrap; }
  nav button { background: transparent; color: var(--dim); border: 1px solid transparent; padding: 7px 14px; border-radius: 10px 10px 0 0; cursor: pointer; font-size: 13px; }
  nav button.active { color: var(--text); background: var(--card); border-color: var(--line); border-bottom-color: var(--card); }
  main { padding: 16px 20px 60px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(215px, 1fr)); gap: 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .card h3 { margin: 0 0 8px; font-size: 12px; color: var(--dim); font-weight: 500; letter-spacing: .5px; }
  .big { font-size: 26px; font-weight: 700; letter-spacing: .5px; }
  .sub { color: var(--dim); font-size: 12px; margin-top: 4px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  button.btn { background: var(--card2); color: var(--text); border: 1px solid var(--line); padding: 7px 14px; border-radius: 9px; cursor: pointer; font-size: 13px; }
  button.btn:hover { border-color: var(--accent); }
  button.btn.primary { background: #1d3a5f; border-color: #2f5d94; }
  button.btn.danger { background: #3a1d1d; border-color: #6b2b2b; }
  input, textarea, select { background: var(--card2); color: var(--text); border: 1px solid var(--line); border-radius: 9px; padding: 8px 11px; font: inherit; width: 100%; }
  textarea { min-height: 84px; resize: vertical; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  th { color: var(--dim); font-weight: 500; font-size: 12px; }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 6px; font-size: 11px; border: 1px solid var(--line); color: var(--dim); }
  .tag.on { color: var(--ok); border-color: #2b6b47; }
  .tag.off { color: var(--bad); border-color: #6b2b2b; }
  .mem { border-bottom: 1px solid var(--line); padding: 10px 0; }
  .mem:last-child { border-bottom: 0; }
  .mem .t { font-size: 13px; }
  .mem .m { color: var(--dim); font-size: 11px; margin-top: 3px; }
  .bar { height: 4px; border-radius: 3px; background: #2a3240; overflow: hidden; margin-top: 6px; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  .log { font-family: Consolas, monospace; font-size: 12px; white-space: pre-wrap; word-break: break-all; max-height: 62vh; overflow: auto; }
  .log .l-error { color: var(--bad); }
  .log .l-warn { color: var(--warn); }
  .log .l-debug { color: var(--dim); }
  .hide { display: none; }
  .hint { color: var(--dim); font-size: 12px; }
  .spacer { height: 12px; }
</style>
</head>
<body>
<header>
  <h1>🐟 大肥鱼</h1>
  <div class="chips" id="chips"></div>
</header>

<nav>
  <button data-tab="overview" class="active">概览</button>
  <button data-tab="memory">记忆</button>
  <button data-tab="modules">模块</button>
  <button data-tab="voice">语音</button>
  <button data-tab="qzone">空间</button>
  <button data-tab="logs">日志</button>
</nav>

<main>
  <!-- 概览 -->
  <section id="tab-overview">
    <div class="grid">
      <div class="card"><h3>QQ 连接</h3><div class="big" id="ov-qq">—</div><div class="sub" id="ov-qq-sub"></div></div>
      <div class="card"><h3>模型</h3><div class="big" id="ov-model">—</div><div class="sub" id="ov-model-sub"></div></div>
      <div class="card"><h3>记忆</h3><div class="big" id="ov-mem">—</div><div class="sub">条长期记忆</div></div>
      <div class="card"><h3>会话</h3><div class="big" id="ov-sessions">—</div><div class="sub">个聊天上下文</div></div>
      <div class="card"><h3>上下文（上一轮）</h3><div class="big" id="ov-ctx">—</div><div class="sub" id="ov-ctx-sub"></div></div>
      <div class="card"><h3>余额</h3><div class="big" id="ov-balance">—</div><div class="sub" id="ov-balance-sub"></div></div>
      <div class="card"><h3>今日消息</h3><div class="big" id="ov-today">—</div><div class="sub">聊天流水条数</div></div>
      <div class="card"><h3>空间评论</h3><div class="big" id="ov-qzone">—</div><div class="sub" id="ov-qzone-sub"></div></div>
    </div>
    <div class="spacer"></div>
    <div class="card">
      <h3>最近日志</h3>
      <div class="log" id="ov-logs">加载中…</div>
    </div>
  </section>

  <!-- 记忆 -->
  <section id="tab-memory" class="hide">
    <div class="row" style="margin-bottom:12px">
      <input id="mem-search" placeholder="搜索记忆内容 / 人…" style="max-width:320px" />
      <button class="btn" onclick="loadMemories()">刷新</button>
      <span class="hint" id="mem-count"></span>
    </div>
    <div class="card" id="mem-list">加载中…</div>
  </section>

  <!-- 模块 -->
  <section id="tab-modules" class="hide">
    <div class="row" style="margin-bottom:12px">
      <button class="btn" onclick="loadModules()">刷新</button>
      <span class="hint">自建模块可以在这里开关；内置模块建议去插件设置里改</span>
    </div>
    <div class="card"><table id="mod-table"><thead><tr><th>模块</th><th>状态</th><th>运行</th><th>说明</th><th></th></tr></thead><tbody></tbody></table></div>
  </section>

  <!-- 语音 -->
  <section id="tab-voice" class="hide">
    <div class="card">
      <h3>试听</h3>
      <textarea id="voice-text">主人主人，我回来啦，今天吃了两碗白米饭。</textarea>
      <div class="spacer"></div>
      <div class="row">
        <button class="btn primary" onclick="testVoice()">合成</button>
        <span class="hint" id="voice-info"></span>
      </div>
      <div class="spacer"></div>
      <audio id="voice-audio" controls style="width:100%"></audio>
    </div>
  </section>

  <!-- 空间 -->
  <section id="tab-qzone" class="hide">
    <div class="grid">
      <div class="card"><h3>状态</h3><div class="big" id="qz-state">—</div><div class="sub" id="qz-sub"></div></div>
      <div class="card"><h3>今日已评</h3><div class="big" id="qz-count">—</div><div class="sub" id="qz-last"></div></div>
    </div>
    <div class="spacer"></div>
    <div class="card">
      <h3>操作</h3>
      <div class="row">
        <button class="btn" onclick="qzSet('enabled','1')">开启</button>
        <button class="btn" onclick="qzSet('enabled','0')">关闭</button>
        <button class="btn" onclick="qzSet('dryRun','1')">演练模式</button>
        <button class="btn primary" onclick="qzSet('dryRun','0')">真发模式</button>
        <button class="btn" onclick="qzPost(0)">演练一条</button>
        <button class="btn danger" onclick="qzPost(1)">立刻真发一条</button>
      </div>
      <div class="spacer"></div>
      <div class="hint" id="qz-hint">「立刻真发」会公开评论一条空间说说，慎点。</div>
    </div>
  </section>

  <!-- 日志 -->
  <section id="tab-logs" class="hide">
    <div class="row" style="margin-bottom:10px">
      <button class="btn" onclick="loadLogs()">刷新</button>
      <select id="log-level" style="max-width:140px" onchange="renderLogs()">
        <option value="">全部</option>
        <option value="info">info</option>
        <option value="warn">warn</option>
        <option value="error">error</option>
        <option value="debug">debug</option>
      </select>
      <span class="hint" id="log-count"></span>
    </div>
    <div class="card"><div class="log" id="log-box">加载中…</div></div>
  </section>
</main>

<script>
const $ = (s) => document.querySelector(s)
const api = (p) => fetch(p).then((r) => r.json())
const post = (p, body) => fetch(p, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body || {}) }).then((r) => r.json())
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))

let LOGS = []
let MEMS = []
let activeTab = 'overview'

// ---------------- tabs
document.querySelectorAll('nav button').forEach((b) => {
  b.onclick = () => {
    activeTab = b.dataset.tab
    document.querySelectorAll('nav button').forEach((x) => x.classList.toggle('active', x === b))
    document.querySelectorAll('main section').forEach((s) => s.classList.toggle('hide', s.id !== 'tab-' + activeTab))
    if (activeTab === 'memory') loadMemories()
    if (activeTab === 'modules') loadModules()
    if (activeTab === 'qzone') loadQzone()
    if (activeTab === 'logs') loadLogs()
  }
})

// ---------------- 概览
async function loadOverview() {
  let ownerQQ = ''
  try {
    const st = await api('/aurabot/api/state')
    ownerQQ = (st.config && st.config.ownerQQ) || ''
    const online = st.onebot && st.onebot.state === 'connected'
    $('#ov-qq').textContent = online ? '在线' : '离线'
    $('#ov-qq').style.color = online ? 'var(--ok)' : 'var(--bad)'
    $('#ov-qq-sub').textContent = st.onebot?.login?.nickname || st.onebot?.problem || ''
    $('#ov-model').textContent = st.config?.model?.model || '—'
    $('#ov-model-sub').textContent = (st.config?.model?.provider || '') + ' · ' + (st.config?.model?.reasoningEffort || '')
    $('#ov-sessions').textContent = Object.keys(st.sessions || {}).length || '—'
    $('#chips').innerHTML =
      '<span class="chip"><span class="dot ' + (online ? 'on' : '') + '"></span>' + (online ? 'QQ 在线' : 'QQ 离线') + '</span>' +
      '<span class="chip">模型 <b>' + esc(st.config?.model?.model || '?') + '</b></span>' +
      '<span class="chip">版本 <b>' + esc(st.version || '?') + '</b></span>'
  } catch (e) { $('#ov-qq-sub').textContent = '读取失败：' + e.message }

  try {
    const m = await api('/aurabot/api/memories')
    MEMS = m.items || []
    $('#ov-mem').textContent = MEMS.length
  } catch (e) {}

  try {
    const c = await api('/aurabot/api/ext/self-inspect/context?chat=private:' + encodeURIComponent(ownerQQ))
    const u = c.context?.realUsage || {}
    const last = u.last
    if (last) {
      $('#ov-ctx').textContent = last.promptTokens.toLocaleString()
      $('#ov-ctx-sub').textContent = '输入 ' + last.inputTokens + ' + 缓存 ' + last.cacheReadTokens + ' · 共 ' + u.turns + ' 轮'
    } else {
      $('#ov-ctx').textContent = '—'
      $('#ov-ctx-sub').textContent = '私聊会话还没跑过'
    }
    $('#ov-today').textContent = c.context?.todayLog?.lines ?? '—'
  } catch (e) {}

  try {
    const w = await api('/aurabot/api/ext/wallet/state')
    $('#ov-balance').textContent = w.deepseek?.total ?? '—'
    $('#ov-balance-sub').textContent = 'DeepSeek ' + (w.deepseek?.currency || 'CNY')
  } catch (e) {}

  try {
    const q = await api('/aurabot/api/ext/qzone-live/state')
    const s = q.settings || {}
    $('#ov-qzone').textContent = s.enabled ? (s.dryRun ? '演练' : '真发') : '关闭'
    $('#ov-qzone-sub').textContent = '今日 ' + (q.state?.count || 0) + ' 条'
    $('#qz-state').textContent = s.enabled ? (s.dryRun ? '演练中' : '真发中') : '已关闭'
    $('#qz-sub').textContent = '每 ' + s.intervalMinutes + ' 分钟 · 每天最多 ' + s.maxPerDay + ' 条'
    $('#qz-count').textContent = (q.state?.count || 0) + ' / ' + (s.maxPerDay || '?')
    $('#qz-last').textContent = q.state?.last ? (q.state.last.who + '：' + q.state.last.comment) : '还没评过'
  } catch (e) {}

  try {
    const l = await api('/aurabot/api/logs')
    LOGS = (l.entries || []).slice(-40)
    $('#ov-logs').innerHTML = LOGS.slice(-12).map((x) => '<div class="l-' + x.level + '">' + x.time + ' [' + esc(x.area) + '] ' + esc(x.text) + '</div>').join('')
  } catch (e) {}
}

// ---------------- 记忆
async function loadMemories() {
  try {
    const m = await api('/aurabot/api/memories')
    MEMS = m.items || []
    renderMemories()
  } catch (e) { $('#mem-list').textContent = '读取失败：' + e.message }
}
function renderMemories() {
  const q = $('#mem-search').value.trim()
  const list = MEMS.filter((x) => !q || (x.text + ' ' + (x.aboutName || '')).toLowerCase().includes(q.toLowerCase()))
  $('#mem-count').textContent = list.length + ' / ' + MEMS.length + ' 条'
  $('#mem-list').innerHTML = list.slice(0, 200).map((x) =>
    '<div class="mem"><div class="t">' + esc(x.text) + '</div>' +
    '<div class="m">' + esc(x.aboutName || x.about || '—') + ' · 重要度 ' + (x.importance ?? '?') + ' · ' + esc(x.source || '') + ' · ' + new Date(x.at || Date.now()).toLocaleString('zh-CN') + '</div>' +
    '<div class="bar"><i style="width:' + Math.round((x.importance || 0) * 100) + '%"></i></div></div>'
  ).join('') || '<div class="hint">没有匹配的记忆</div>'
}
$('#mem-search').oninput = renderMemories

// ---------------- 模块
async function loadModules() {
  try {
    const m = await api('/aurabot/api/modules')
    const rows = (m.list || []).map((x) =>
      '<tr><td>' + esc(x.name || x.id) + '<div class="hint">' + esc(x.id) + '</div></td>' +
      '<td><span class="tag ' + (x.enabled ? 'on' : 'off') + '">' + (x.enabled ? '开' : '关') + '</span></td>' +
      '<td>' + (x.running ? '<span class="tag on">' + esc(x.running) + '</span>' : '<span class="tag off">未运行</span>') + '</td>' +
      '<td class="hint">' + esc(x.error || x.description || '') + '</td>' +
      '<td>' + (x.builtin ? '<span class="hint">内置</span>' : '<button class="btn" onclick="toggleModule(\'' + x.id + '\',' + (!x.enabled) + ')">' + (x.enabled ? '关闭' : '开启') + '</button>') + '</td></tr>'
    ).join('')
    $('#mod-table tbody').innerHTML = rows || '<tr><td colspan="5" class="hint">没有模块</td></tr>'
  } catch (e) { $('#mod-table tbody').innerHTML = '<tr><td colspan="5">读取失败：' + esc(e.message) + '</td></tr>' }
}
async function toggleModule(id, enabled) {
  await post('/aurabot/api/save', { modules: { [id]: { enabled } } })
  setTimeout(loadModules, 600)
}

// ---------------- 语音
async function testVoice() {
  const text = $('#voice-text').value.trim()
  if (!text) return
  $('#voice-info').textContent = '合成中…'
  try {
    const r = await post('/aurabot/api/voice/test', { text })
    if (!r.data) throw new Error(r.message || '没有音频')
    $('#voice-audio').src = 'data:' + (r.mime || 'audio/wav') + ';base64,' + r.data
    $('#voice-info').textContent = '引擎：' + (r.engine || '?')
  } catch (e) { $('#voice-info').textContent = '失败：' + e.message }
}

// ---------------- 空间
async function loadQzone() { loadOverview() }
async function qzSet(key, val) {
  try {
    await api('/aurabot/api/ext/qzone-live/set?' + key + '=' + encodeURIComponent(val))
    $('#qz-hint').textContent = '已更新：' + key + '=' + val
    loadOverview()
  } catch (e) { $('#qz-hint').textContent = '失败：' + e.message }
}
async function qzPost(real) {
  $('#qz-hint').textContent = '执行中…'
  try {
    const url = real ? '/aurabot/api/ext/qzone-live/post?force=1' : '/aurabot/api/ext/qzone-live/run?force=1'
    const r = await api(url)
    const x = r.result || {}
    $('#qz-hint').textContent = x.ok ? ((x.dryRun ? '[演练] ' : '[已发] ') + x.who + '：' + x.comment) : ('没发：' + (x.message || ''))
    loadOverview()
  } catch (e) { $('#qz-hint').textContent = '失败：' + e.message }
}

// ---------------- 日志
async function loadLogs() {
  try {
    const l = await api('/aurabot/api/logs')
    LOGS = l.entries || []
    renderLogs()
  } catch (e) { $('#log-box').textContent = '读取失败：' + e.message }
}
function renderLogs() {
  const lv = $('#log-level').value
  const list = (lv ? LOGS.filter((x) => x.level === lv) : LOGS).slice(-300)
  $('#log-count').textContent = list.length + ' 条'
  $('#log-box').innerHTML = list.map((x) => '<div class="l-' + x.level + '">' + x.time + ' [' + esc(x.area) + '] ' + esc(x.text) + '</div>').join('')
  $('#log-box').scrollTop = $('#log-box').scrollHeight
}

// ---------------- 启动
loadOverview()
setInterval(() => { if (activeTab === 'overview') loadOverview() }, 15000)
setInterval(() => { if (activeTab === 'logs') loadLogs() }, 8000)
</script>
</body>
</html>
